<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Primeiro Titulo </title>
    <link rel="stylesheet" href="base.css">
</head>

<body>
    <!-- Criado o primeiro arquivo do projeto -->

    <header></header>

    <main>

        <section class="formCadastro">
            <h3>Cadastrar um Novo Veículo</h3>

            <form id="formCadastroVeiculo">
                <label>Imagem:</label>
                <img src="https://midiawm1.webmotors.com.br/wp-content/uploads/2024/08/05142722/Fiat-Uno-Mille-Fire-Economy-2.webp" alt="Imagem de um carro" id="inImg">

                <label for="marca">Marca:</label>
                <input type="text" id="inMarca" name="marca" placeholder="Digite a marca aqui..." required>

                <label for="modelo">Modelo:</label>
                <input type="text" id="inModelo" name="modelo" placeholder="Digite o modelo aqui..." required>

                <label for="ano">Ano:</label>
                <input type="number" id="inAno" name="ano" placeholder="Digite o ano aqui..." required>

                <label for="descricao">Descrição:</label>
                <textarea name="descricao" id="inDescricao" placeholder="Digite a descrição aqui..."></textarea>

                <button type="submit">Cadastrar</button>
            </form>
        </section>

    </main>


    <footer>

        <div class="informacoes">
            <div class="footer-esquerda">
                <h3>Sobre nós</h3>
                <p>Facilitamos a busca pelo carro ideal, conectando você às melhores oportunidades.</p>
                <h3>Redes Sociais</h3>

                <div class="links-redes-sociais">
                    <a href=""><ion-icon name="logo-instagram"></ion-icon></a>
                    <a href=""><ion-icon name="logo-facebook"></ion-icon></a>
                    <a href=""><ion-icon name="logo-linkedin"></ion-icon></a>
                </div>

            </div>

            <div class="footer-direita">
                <h3>Links úteis</h3>

                <div class="links-uteis">
                    <a href="#">Início</a>
                    <a href="#">Sobre</a>
                    <a href="#">Serviços</a>
                    <a href="#">Contato</a>
                </div>


                <h3>Contato</h3>
                <div class="links-contato">
                    <a href="#">e-mail</a>
                    <a href="#">Telefone</a>
                    <a href="#">Endereço</a>
                </div>

            </div>
        </div>



        <hr>

        <div class="f2">
            <div class="footer-email">
                <p>© 2026 Car Site. Todos os direitos reservados.</p>
            </div>

        </div>

    </footer>

    <script type="module" src="./script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
